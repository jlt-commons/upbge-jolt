name: metrics

# The jolt-metrics report: the refactoring queue, hotspots, duplicates, lint
# findings and cleanup candidates. It reports and never fails the build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: metrics-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # hotspots and unusual changes read the git history
          fetch-depth: 0

      - name: Install jolt-metrics
        # the latest release's standalone binary, so fixes arrive without a
        # change here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo jlt-commons/jolt-metrics --pattern '*-x86_64-linux.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/jolt-metrics-*-x86_64-linux.tar.gz -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install "$RUNNER_TEMP"/jolt-metrics-*-x86_64-linux/jolt-metrics "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gh release view --repo jlt-commons/jolt-metrics --json tagName -q '"jolt-metrics " + .tagName'

      - name: Report
        run: |
          jolt-metrics . metrics-report.md
          jolt-metrics . metrics-report.html
          # the summary stops before the long per-file tables
          awk '/^## Files$/{exit} {print}' metrics-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: metrics-report
          path: |
            metrics-report.md
            metrics-report.html
